[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malurlguard"
version = "0.1.0"
description = "ML-based Malicious URL Classifier for MBC Telkom University Lab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MBC Telkom University", email = "lab@telkomuniversity.ac.id"}
]
keywords = ["security", "machine-learning", "url-classification", "phishing-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "tldextract>=5.0",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "click>=8.1",
    "rich>=13.0",
    "joblib>=1.3",
    "streamlit>=1.30",
    "matplotlib>=3.7",
    "imbalanced-learn>=0.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.3",
]
host = [
    "python-whois>=0.9",
    "dnspython>=2.6",
]

[project.scripts]
malurlguard = "malurlguard.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["malurlguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
